<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – E‑Learning Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="login-body light-mode">
  <div class="login-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="login-wrapper">
    <!-- Theme toggle -->
    <button class="theme-toggle-absolute" id="themeToggle" aria-label="Toggle theme">
      🌙
    </button>

    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🎓 E‑Learn Portal</div>
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Login to access your portal</p>
      </div>

      <!-- Role Selection Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" data-role="student">
          <span class="tab-icon">👨‍🎓</span>
          <span class="tab-label">Student</span>
        </button>
        <button class="role-tab" data-role="applicant">
          <span class="tab-icon">📝</span>
          <span class="tab-label">Applicant</span>
        </button>
        <button class="role-tab" data-role="staff">
          <span class="tab-icon">👨‍🏫</span>
          <span class="tab-label">Staff</span>
        </button>
        <button class="role-tab" data-role="hod">
          <span class="tab-icon">👔</span>
          <span class="tab-label">HOD</span>
        </button>
        <button class="role-tab" data-role="admin">
          <span class="tab-icon">⚙️</span>
          <span class="tab-label">Admin</span>
        </button>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm">
        <!-- Student/Applicant ID Field -->
        <div class="form-group" id="idFieldGroup">
          <label for="userId" id="userIdLabel">Admission ID / Matric Number</label>
          <input
            type="text"
            id="userId"
            name="userId"
            placeholder="Enter your ID"
            required
          />
          <div class="form-hint" id="userIdHint">Use the Admission ID from your admission letter</div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>

        <div class="form-message" id="formMessage" style="display:none;"></div>
      </form>

      <div class="login-footer">
        <div class="footer-note" id="footerNote">
          New applicant?
          <a href="apply.html" class="footer-link">Start Application</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;
    const body = document.body;

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      root.classList.add('dark-mode');
      body.classList.remove('light-mode');
      body.classList.add('dark-mode');
      themeToggle.textContent = '☀️';
    } else {
      root.classList.remove('dark-mode');
      body.classList.remove('dark-mode');
      body.classList.add('light-mode');
      themeToggle.textContent = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = root.classList.toggle('dark-mode');
      if (isDark) {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
      } else {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
      }
      themeToggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Role tabs
    const roleTabs = document.querySelectorAll('.role-tab');
    const userIdLabel = document.getElementById('userIdLabel');
    const userIdHint = document.getElementById('userIdHint');
    const userIdFieldGroup = document.getElementById('idFieldGroup');
    const footerNote = document.getElementById('footerNote');
    const loginForm = document.getElementById('loginForm');
    const formMessage = document.getElementById('formMessage');

    let currentRole = 'student';

    const roleConfig = {
      student: {
        label: 'Admission ID / Matric Number',
        hint: 'Use the Admission ID from your admission letter',
        placeholder: 'e.g. EPU/2026/CS/001',
        redirect: 'student-dashboard.html',
        footer: 'New applicant? <a href="apply-biodata.html" class="footer-link">Start Application</a>'
      },
      applicant: {
        label: 'Application ID / Email',
        hint: 'Enter your Application ID or email used during application',
        placeholder: 'e.g. APP001 or email@example.com',
        redirect: 'applicant-portal.html',
        footer: 'New applicant? <a href="apply-biodata.html" class="footer-link">Start Application</a>'
      },
      staff: {
        label: 'Staff ID / Email',
        hint: 'Enter your Staff ID or institutional email',
        placeholder: 'e.g. STAFF001 or staff@elearning.edu.ng',
        redirect: 'staff-dashboard.html',
        footer: 'Contact IT support for login issues'
      },
      hod: {
        label: 'HOD ID / Email',
        hint: 'Enter your HOD ID or institutional email',
        placeholder: 'e.g. HOD001 or hod@elearning.edu.ng',
        redirect: 'hod-dashboard.html',
        footer: 'Contact IT support for login issues'
      },
      admin: {
        label: 'Admin ID / Email',
        hint: 'Enter your Admin ID or institutional email',
        placeholder: 'e.g. ADMIN001 or admin@elearning.edu.ng',
        redirect: 'admin-dashboard.html',
        footer: 'Contact IT support for login issues'
      }
    };

    // Switch role tabs
    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Remove active class from all
        roleTabs.forEach(t => t.classList.remove('active'));
        
        // Add active to clicked
        tab.classList.add('active');
        
        // Update current role
        currentRole = tab.dataset.role;
        
        // Update form fields
        const config = roleConfig[currentRole];
        userIdLabel.textContent = config.label;
        userIdHint.textContent = config.hint;
        document.getElementById('userId').placeholder = config.placeholder;
        footerNote.innerHTML = config.footer;
        
        // Hide form message
        formMessage.style.display = 'none';
      });
    });

    // Password toggle
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');

    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordToggle.textContent = isPassword ? '🙈' : '👁️';
    });

    // Demo users database
    const usersDB = {
      // Students
      'EPU/2026/CS/001': { role: 'student', password: 'password123', name: 'John Doe' },
      'EPU/2026/IT/002': { role: 'student', password: 'password123', name: 'Jane Smith' },
      
      // Applicants
      'APP001': { role: 'applicant', password: 'password123', name: 'John Doe' },
      'john.doe@example.com': { role: 'applicant', password: 'password123', name: 'John Doe' },
      
      // Staff
      'STAFF001': { role: 'staff', password: 'password123', name: 'Dr. Smith' },
      'staff@elearning.edu.ng': { role: 'staff', password: 'password123', name: 'Dr. Smith' },
      
      // HOD
      'HOD001': { role: 'hod', password: 'password123', name: 'Prof. Johnson' },
      'hod@elearning.edu.ng': { role: 'hod', password: 'password123', name: 'Prof. Johnson' },
      
      // Admin
      'ADMIN001': { role: 'admin', password: 'admin123', name: 'Admin User' },
      'admin@elearning.edu.ng': { role: 'admin', password: 'admin123', name: 'Admin User' }
    };

    // Login form submission
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;

      // Find user
      const user = usersDB[userId];

      if (!user) {
        formMessage.textContent = 'Invalid credentials. Please check your ID and try again.';
        formMessage.className = 'form-message error';
        formMessage.style.display = 'block';
        return;
      }

      if (user.password !== password) {
        formMessage.textContent = 'Incorrect password. Please try again.';
        formMessage.className = 'form-message error';
        formMessage.style.display = 'block';
        return;
      }

      if (user.role !== currentRole) {
        formMessage.textContent = `This account is for ${user.role} portal, not ${currentRole}. Please select the correct role.`;
        formMessage.className = 'form-message error';
        formMessage.style.display = 'block';
        return;
      }

      // Success
      formMessage.textContent = `Login successful! Welcome, ${user.name}. Redirecting...`;
      formMessage.className = 'form-message success';
      formMessage.style.display = 'block';

      // Store user info
      sessionStorage.setItem('user', JSON.stringify({
        id: userId,
        role: user.role,
        name: user.name
      }));

      // Redirect based on role
      setTimeout(() => {
        window.location.href = roleConfig[currentRole].redirect;
      }, 1000);
    });
  </script>
</body>
</html>
